services:
  - type: web
    name: onchain-detective
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: RATE_LIMIT_PER_MIN
        value: "25"
      # Behind Render's proxy: trust X-Forwarded-For using Render's edge strategy (leftmost IP)
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: PROXY_STRATEGY
        value: "render"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Secrets: set in the Render dashboard (sync: false), never commit values.
      - key: ADMIN_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: TRON_API_KEY
        sync: false
